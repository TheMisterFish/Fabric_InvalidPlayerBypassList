name: Coverage Report
on: [ workflow_dispatch ]
permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}

      - name: Run all tests with coverage
        run: ./gradlew runAllTestsWithCoverage jacocoTestReport --stacktrace

      - name: Extract metadata
        id: meta
        run: |
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y-%m-%d")" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +"%Y-%m-%d %H:%M UTC")" >> $GITHUB_OUTPUT
          echo "java=$(java -version 2>&1 | head -n 1)" >> $GITHUB_OUTPUT
          MC_VERSION=$(grep '^works_for_version' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "mc_version=$MC_VERSION" >> $GITHUB_OUTPUT
          echo "page_name=JaCoCo-report-Mc-version-${MC_VERSION}-$(date -u +"%Y-%m-%d")" >> $GITHUB_OUTPUT

      - name: Prepare wiki repo
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki

      - name: Copy JaCoCo HTML report into wiki
        run: |
          PAGE_NAME="${{ steps.meta.outputs.page_name }}"
          REPORT_DIR="build/reports/jacocoCombinedHtml"

          mkdir -p "wiki/${PAGE_NAME}"
          cp -r "${REPORT_DIR}/"* "wiki/${PAGE_NAME}/"

      - name: Create index page linking to HTML report
        run: |
          PAGE_NAME="${{ steps.meta.outputs.page_name }}"
          BRANCH="${{ steps.meta.outputs.branch }}"
          COMMIT="${{ steps.meta.outputs.commit }}"
          TIMESTAMP="${{ steps.meta.outputs.timestamp }}"
          JAVA="${{ steps.meta.outputs.java }}"
          MC_VERSION="${{ steps.meta.outputs.mc_version }}"

          cat > "wiki/${PAGE_NAME}.md" <<EOF
          # JaCoCo Coverage Report
          
          **Branch:** ${BRANCH}  
          **Commit:** ${COMMIT}  
          **Tested at:** ${TIMESTAMP}  
          **Java:** ${JAVA}  
          **Minecraft:** ${MC_VERSION}
          
          ---
          
          ## Full HTML Report
          
          [Open JaCoCo HTML Report](./${PAGE_NAME}/index.html)
          
          EOF

      - name: Commit & push wiki changes
        run: |
          PAGE_NAME="${{ steps.meta.outputs.page_name }}"

          cd wiki
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add "${PAGE_NAME}" "${PAGE_NAME}.md"
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "Coverage report: Mc ${{ steps.meta.outputs.mc_version }} @ ${{ steps.meta.outputs.date }}"
          git push
