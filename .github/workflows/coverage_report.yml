name: Coverage Report

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}

      - name: Run all tests with coverage
        run: ./gradlew runAllTestsWithCoverage --stacktrace

      - name: Extract metadata
        id: meta
        run: |
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +"%Y-%m-%d %H:%M UTC")" >> $GITHUB_OUTPUT
          echo "java=$(java -version 2>&1 | head -n 1)" >> $GITHUB_OUTPUT
          echo "mc_version=$(grep minecraft_version gradle.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Convert JaCoCo HTML → Markdown summary
        id: jacoco
        uses: PavanMudigonda/jacoco-reporter@v5.0
        with:
          report_paths: |
            build/reports/jacocoCombinedHtml/index.html
          coverage_report_title: "Combined Coverage Report"
          skip_check_run: true
          min_coverage: 0

      - name: Prepare wiki repo
        run: |
          git clone https://github.com/${{ github.repository }}.wiki.git wiki

      - name: Write Markdown page
        run: |
          mkdir -p wiki/coverage
          cat <<EOF > wiki/coverage/combined.md
# Combined Coverage Report

**Branch:** ${{ steps.meta.outputs.branch }}  
**Commit:** ${{ steps.meta.outputs.commit }}  
**Tested at:** ${{ steps.meta.outputs.timestamp }}  
**Java:** ${{ steps.meta.outputs.java }}  
**Minecraft:** ${{ steps.meta.outputs.mc_version }}

---

## Summary

${{ steps.jacoco.outputs.markdown }}

---

## Full HTML Report

Hosted on GitHub Pages:  
https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/coverage/combined/

EOF

      - name: Commit & push to wiki
        run: |
          cd wiki
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Update coverage report for ${{ steps.meta.outputs.branch }} @ ${{ steps.meta.outputs.commit }}"
          git push
