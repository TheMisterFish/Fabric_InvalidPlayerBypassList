name: Coverage Report
on: [ workflow_dispatch ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      page_name: ${{ steps.meta.outputs.page_name }}
      branch: ${{ steps.meta.outputs.branch }}
      commit: ${{ steps.meta.outputs.commit }}
      timestamp: ${{ steps.meta.outputs.timestamp }}
      java: ${{ steps.meta.outputs.java }}
      mc_version: ${{ steps.meta.outputs.mc_version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}

      - name: Run all tests with coverage
        run: ./gradlew runAllTestsWithCoverage jacocoTestReport --stacktrace

      - name: Extract metadata
        id: meta
        run: |
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y-%m-%d")" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +"%Y-%m-%d %H:%M UTC")" >> $GITHUB_OUTPUT
          echo "java=$(java -version 2>&1 | head -n 1)" >> $GITHUB_OUTPUT
          MC_VERSION=$(grep '^works_for_version' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "mc_version=$MC_VERSION" >> $GITHUB_OUTPUT
          echo "page_name=JaCoCo-report-Mc-version-${MC_VERSION}-$(date -u +"%Y-%m-%d")" >> $GITHUB_OUTPUT

      - name: Upload JaCoCo HTML artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/reports/jacocoCombinedHtml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

  update-wiki:
    needs: [build, deploy]
    runs-on: ubuntu-latest

    steps:
      - name: Clone wiki repo
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki

      - name: Create wiki page linking to GitHub Pages report
        run: |
          PAGE_NAME="${{ needs.build.outputs.page_name }}"
          BRANCH="${{ needs.build.outputs.branch }}"
          COMMIT="${{ needs.build.outputs.commit }}"
          TIMESTAMP="${{ needs.build.outputs.timestamp }}"
          JAVA="${{ needs.build.outputs.java }}"
          MC_VERSION="${{ needs.build.outputs.mc_version }}"

          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.html"

          cat > "wiki/${PAGE_NAME}.md" <<EOF
          # JaCoCo Coverage Report
          
          **Branch:** ${BRANCH}  
          **Commit:** ${COMMIT}  
          **Tested at:** ${TIMESTAMP}  
          **Java:** ${JAVA}  
          **Minecraft:** ${MC_VERSION}
          
          ---
          
          ## Full HTML Report (GitHub Pages)
          
          [Open JaCoCo HTML Report](${REPORT_URL})
          
          EOF

      - name: Commit & push wiki changes
        run: |
          PAGE_NAME="${{ needs.build.outputs.page_name }}"

          cd wiki
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add "${PAGE_NAME}.md"
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "Coverage report: Mc ${{ needs.build.outputs.mc_version }} @ ${{ needs.build.outputs.timestamp }}"
          git push
